<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meraloma FC — Women's Teams — Combined Schedule</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Cinzel:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-dark:#132A22;
    --pitch:#1F4D3A;
    --turf:#3E7A5B;
    --chalk:#F6F3EA;
    --paper:#FFFFFF;
    --ink:#1B1B18;
    --ink-soft:#5C5A52;
    --line:#DCD7C8;
    --amber:#DE5500;
    --brand-orange:#FF6123;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--chalk);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    padding:0 0 4rem;
  }
  .field-header{
    background:var(--pitch-dark);
    color:var(--chalk);
    padding:2.6rem 1.5rem 2.2rem;
    position:relative;
    z-index:0;
    overflow:hidden;
  }
  .field-header .wrap{
    position:relative;
    z-index:1;
  }
  .crest{
    display:flex;
    align-items:center;
    gap:12px;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-size:12.5px;
    color:#B9C9BE;
    margin-bottom:0.9rem;
  }
  .logo-m{
    height:30px;
    width:auto;
    flex:none;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,0.25));
  }
  .crest .brand{
    font-family:'Cinzel', serif;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-size:16px;
    text-shadow:0 0 6px rgba(19,42,34,0.9), 0 0 12px rgba(19,42,34,0.7), 0 1px 2px rgba(0,0,0,0.6);
  }
  h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:clamp(28px,5vw,40px);
    letter-spacing:0.01em;
    margin:0 0 0.3rem;
    max-width:640px;
    position:relative;
  }
  .subhead{
    font-size:15.5px;
    color:#CBD8CF;
    margin:0;
    max-width:560px;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 1.5rem;
  }
  @media (min-width:900px){
    .wrap{max-width:900px;}
    .field-header .wrap{max-width:900px;margin:0 auto;padding:0 1.5rem;}
    .summary-row{gap:16px;}
    .stat{padding:1rem 1.2rem;}
  }
  .summary-row{
    display:flex;
    gap:10px;
    margin-top:-1.6rem;
    position:relative;
    z-index:2;
    flex-wrap:wrap;
  }
  .stat{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:2px;
    padding:0.75rem 1rem;
    flex:1;
    min-width:130px;
    text-align:center;
    display:block;
    text-decoration:none;
    color:inherit;
    transition:box-shadow 0.15s ease, transform 0.15s ease;
  }
  a.stat:hover, a.stat:focus{
    box-shadow:0 2px 8px rgba(19,42,34,0.18);
    transform:translateY(-1px);
  }
  .stat .num{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--pitch);
    line-height:1;
  }
  .stat .lbl{
    font-family:'Oswald', sans-serif;
    font-size:10.5px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .note{
    font-family:'Oswald', sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:2rem;
    letter-spacing:0.02em;
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
const UNITED_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCBVfNkJveKoZE0-CB3ew5bfokudLYUtvYuE6a_s9p1WoEHA5Bri4tQJKmT6VnT80Kjqi1iCOCfU7C/pub?gid=0&single=true&output=csv";

function computeRecord(rows) {
  let w = 0, d = 0, l = 0;
  rows.forEach(row => {
    const homeScore = (row.home_score || "").trim();
    const awayScore = (row.away_score || "").trim();
    if (homeScore === "" || awayScore === "") return;
    const usScore = row.us === 'home' ? homeScore : awayScore;
    const themScore = row.us === 'home' ? awayScore : homeScore;
    if (Number(usScore) > Number(themScore)) w++;
    else if (Number(usScore) < Number(themScore)) l++;
    else d++;
  });
  return w + "-" + d + "-" + l;
}

Papa.parse(UNITED_CSV_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: (results) => {
    document.getElementById('record-United').textContent = computeRecord(results.data);
  },
  error: (err) => {
    console.error('Meralomas United schedule fetch failed:', err);
  }
});
</script>
