<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meraloma FC M-A — Division 1 (Over 35) — VMSL Winter League</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Cinzel:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-dark:#132A22;
    --pitch:#1F4D3A;
    --turf:#3E7A5B;
    --chalk:#F6F3EA;
    --paper:#FFFFFF;
    --ink:#1B1B18;
    --ink-soft:#5C5A52;
    --line:#DCD7C8;
    --amber:#DE5500;
    --amber-bg:#F7E7D2;
    --away-tag:#EDEAE0;
    --away-ink:#6B6858;
    --loss-bg:#F3DCD7;
    --loss-ink:#9C3B24;
    --brand-orange:#FF6123;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--chalk);
    color:var(--ink);
    font-family:'Source Serif 4', Georgia, serif;
    padding:0 0 4rem;
  }
  .field-header{
    background:var(--pitch-dark);
    color:var(--chalk);
    padding:2.6rem 1.5rem 2.2rem;
    position:relative;
    z-index:0;
    overflow:hidden;
  }
  .field-ball{
    position:absolute;
    top:-60%;
    right:-40px;
    width:260px;
    height:260px;
    object-fit:contain;
    opacity:0.85;
    z-index:0;
    pointer-events:none;
  }
  .field-header .wrap{
    position:relative;
    z-index:1;
  }
  .crest{
    display:flex;
    align-items:center;
    gap:12px;
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-size:12.5px;
    color:#B9C9BE;
    margin-bottom:0.9rem;
  }
  .crest .diamond{
    width:9px;height:9px;
    background:var(--amber);
    transform:rotate(45deg);
    flex:none;
  }
  .logo-m{
    height:30px;
    width:auto;
    flex:none;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,0.25));
  }
  .crest .brand{
    font-family:'Cinzel', serif;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-size:16px;
    text-shadow:0 0 6px rgba(19,42,34,0.9), 0 0 12px rgba(19,42,34,0.7), 0 1px 2px rgba(0,0,0,0.6);
  }
  h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:clamp(28px,5vw,40px);
    letter-spacing:0.01em;
    margin:0 0 0.3rem;
    max-width:640px;
    position:relative;
  }
  .subhead{
    font-size:15.5px;
    color:#CBD8CF;
    margin:0;
    max-width:560px;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 1.5rem;
  }
  @media (min-width:900px){
    .wrap{max-width:900px;}
    .field-header .wrap{max-width:900px;margin:0 auto;padding:0 1.5rem;}
    .summary-row{gap:16px;}
    .stat{padding:1rem 1.2rem;}
  }
  .summary-row{
    display:flex;
    gap:10px;
    margin-top:-1.6rem;
    position:relative;
    z-index:2;
    flex-wrap:wrap;
  }
  .stat{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:2px;
    padding:0.75rem 1rem;
    flex:1;
    min-width:130px;
    text-align:center;
  }
  .stat .num{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--pitch);
    line-height:1;
  }
  .stat .lbl{
    font-family:'Oswald', sans-serif;
    font-size:10.5px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .list{
    margin-top:2.4rem;
  }
  .fixture{
    display:grid;
    grid-template-columns:52px 1fr;
    gap:16px;
    padding:1.05rem 0;
    border-bottom:1px dashed var(--line);
    align-items:start;
  }
  .fixture:first-child{border-top:1px dashed var(--line);}
  .mw{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--chalk);
    background:var(--pitch);
    width:34px;height:34px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .fixture.next .mw{background:var(--amber);}
  .fx-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
  }
  .fx-date{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:14.5px;
    color:var(--ink);
  }
  .fx-time{
    font-family:'Oswald', sans-serif;
    font-size:13px;
    color:var(--ink-soft);
  }
  .fx-score{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:14.5px;
    padding:1px 8px;
    border-radius:2px;
  }
  .fx-score.win{background:var(--pitch);color:var(--chalk);}
  .fx-score.draw{background:var(--away-tag);color:var(--away-ink);}
  .fx-score.loss{background:var(--loss-bg);color:var(--loss-ink);}
  .fx-teams{
    font-size:17.5px;
    margin:0.3rem 0 0.35rem;
    line-height:1.35;
  }
  .fx-teams .us{font-weight:600;}
  .fx-meta{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Oswald', sans-serif;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .tag{
    font-family:'Oswald', sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:2px 7px;
    border-radius:2px;
  }
  .tag.home{background:rgba(255,97,35,0.22);color:var(--ink);border:1px solid rgba(255,97,35,0.4);}
  .tag.away{background:var(--away-tag);color:var(--away-ink);}
  .next-badge{
    font-family:'Oswald', sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.08em;
    text-transform:uppercase;
    background:var(--brand-orange);
    color:var(--chalk);
    padding:2px 7px;
    border-radius:2px;
  }
  .note{
    font-family:'Oswald', sans-serif;
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:2rem;
    letter-spacing:0.02em;
  }
</style>
</head>

    <h1>Over 35 &middot; Division 1</h1>
    <p class="subhead">VMSL Winter League &middot; Sep 2026&ndash;Jan 2027 &middot; 16 matches, 1 bye week</p>
  </div>
</div>

<div class="wrap">
  <div class="summary-row">
    <div class="stat"><div class="num">16</div><div class="lbl">Matches</div></div>
    <div class="stat"><div class="num">7</div><div class="lbl">Home<br>Trillium Turf West</div></div>
    <div class="stat"><div class="num">9</div><div class="lbl">Away</div></div>
    <div class="stat"><div class="num" id="recordNum" style="color:var(--brand-orange);">&ndash;</div><div class="lbl">Season Record<br>(W-D-L)</div></div>
  </div>

  <div class="list" id="fixtureList"></div>

  <p class="note">Times and venues per VMSL Winter League schedule &middot; subject to league changes</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
// Published Google Sheet CSV link — File > Share > Publish to web on the M-B tab, output CSV.
// Swap this in once the sheet is published.
const SCHEDULE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQs9CJ8-OfQdzK6zHWydSHISSmQi6VhBxB3QcbYbn81ofdlhdVNAIRZEPVVFaWDYELpo98ILUsvXksW/pub?gid=0&single=true&output=csv";

function toFixture(row) {
  return {
    mw: row.mw,
    date: row.date,
    day: row.day,
    time: row.time,
    home: row.home,
    away: row.away,
    us: row.us,
    venue: row.venue,
    note: row.note || "",
    home_score: (row.home_score || "").trim(),
    away_score: (row.away_score || "").trim()
  };
}

function renderFixtures(fixtures) {
  const today = new Date();
  today.setHours(0,0,0,0);
  let nextIdx = fixtures.findIndex(f => f.home && new Date(f.date + "T00:00:00") >= today);
  if (nextIdx === -1) nextIdx = null;

  const list = document.getElementById('fixtureList');
  list.innerHTML = "";
  fixtures.forEach((f, i) => {
    const d = new Date(f.date + "T00:00:00");
    const dateLabel = f.day + " " + d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});

    if (!f.home) {
      const byeRow = document.createElement('div');
      byeRow.className = 'fixture';
      byeRow.innerHTML =
        '<div class="mw">' + f.mw + '</div>' +
        '<div>' +
          '<div class="fx-top"><span class="fx-date">' + dateLabel + '</span></div>' +
          '<p class="fx-teams" style="color:var(--ink-soft);font-style:italic;">Bye Week</p>' +
          (f.note ? '<div class="fx-meta"><span>' + f.note + '</span></div>' : '') +
        '</div>';
      list.appendChild(byeRow);
      return;
    }

    const isNext = i === nextIdx;
    const hasScore = f.home_score !== "" && f.away_score !== "";

    let rightSide;
    if (hasScore) {
      const usScore = f.us === 'home' ? f.home_score : f.away_score;
      const themScore = f.us === 'home' ? f.away_score : f.home_score;
      let result = 'draw';
      if (Number(usScore) > Number(themScore)) result = 'win';
      else if (Number(usScore) < Number(themScore)) result = 'loss';
      rightSide = '<span class="fx-score ' + result + '">' + f.home_score + '&ndash;' + f.away_score + '</span>';
    } else {
      rightSide = '<span class="fx-time">' + f.time + '</span>';
    }

    const row = document.createElement('div');
    row.className = 'fixture' + (isNext ? ' next' : '');
    row.innerHTML =
      '<div class="mw">' + f.mw + '</div>' +
      '<div>' +
        '<div class="fx-top">' +
          '<span class="fx-date">' + dateLabel + '</span>' +
          rightSide +
        '</div>' +
        '<p class="fx-teams"><span class="' + (f.us==='home' ? 'us' : '') + '">' + f.home + '</span> vs <span class="' + (f.us==='away' ? 'us' : '') + '">' + f.away + '</span></p>' +
        '<div class="fx-meta">' +
          '<span class="tag ' + f.us + '">' + (f.us === 'home' ? 'Home' : 'Away') + '</span>' +
          '<span>' + f.venue + '</span>' +
          (isNext ? '<span class="next-badge">Next match</span>' : '') +
        '</div>' +
        (f.note ? '<div class="fx-meta" style="margin-top:4px;"><span>' + f.note + '</span></div>' : '') +
      '</div>';
    list.appendChild(row);
  });
}

function computeRecord(fixtures) {
  let w = 0, d = 0, l = 0;
  fixtures.forEach(f => {
    if (f.home_score === "" || f.away_score === "") return;
    const usScore = f.us === 'home' ? f.home_score : f.away_score;
    const themScore = f.us === 'home' ? f.away_score : f.home_score;
    if (Number(usScore) > Number(themScore)) w++;
    else if (Number(usScore) < Number(themScore)) l++;
    else d++;
  });
  return w + "-" + d + "-" + l;
}

Papa.parse(SCHEDULE_CSV_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {
    const fixtures = results.data.map(toFixture);
    renderFixtures(fixtures);
    document.getElementById('recordNum').textContent = computeRecord(fixtures);
  },
  error: function(err) {
    document.getElementById('fixtureList').innerHTML =
      '<p class="note">Couldn\'t load the schedule right now — please try again shortly.</p>';
    console.error('Schedule fetch failed:', err);
  }
});
</script>
